name: தன்விவஙர்களின் சோதனைகள்

concurrency:
  group: சோதனைகள்-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
        - '**.md'

jobs:
  sodhanai:
    name: சோதனைகள்
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: UV நிறுவல்
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: சார்பு நிறுவல்
        run: uv install

      - name: சோதிக்க
        run: uv run coverage run -m pytest && uv run coverage xml

      - name: Envoyer rapports de couverture à Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
